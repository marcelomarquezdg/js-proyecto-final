<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../js/gestion.js" defer></script>
    <title>Chelo's Guitars - Gestión</title>
</head>

<body>

    <header>
        <div class="header-contenido">
            <a href="../index.html" class="logo-link">
                <img src="../assets/img/branding/chelos-guitars-logo.webp" alt="Chelo's Guitars" class="logo">
            </a>

            <nav>
                <a href="../index.html">Inicio</a>
                <a href="./carrito.html">Carrito</a>
                <a href="./gestion.html" class="nav-activo">Gestión</a>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="titulo-seccion">Gestión de inventario</h1>
        <p class="gestion-intro">
            Administrá las guitarras disponibles en la tienda.
        </p>

        <section class="seccion-busqueda gestion-busqueda">
            <label for="busqueda">Buscar por marca o modelo</label>
            <input type="text" id="busqueda" placeholder="Ej: Fender o Telecaster">
        </section>

        <section>
            <h2 class="titulo-seccion">Guitarras disponibles</h2>

            <div id="contenedor-guitarras" class="productos"></div>
        </section>

        <section class="seccion-formulario">
            <h2 class="titulo-seccion">Agregar guitarra</h2>

            <form id="form-agregar-guitarra" class="form-guitarra">

                <div class="campo-formulario">
                    <label for="input-marca">Marca</label>
                    <input type="text" id="input-marca">
                </div>

                <div class="campo-formulario">
                    <label for="input-modelo">Modelo</label>
                    <input type="text" id="input-modelo">
                </div>

                <div class="campo-formulario">
                    <label for="input-anio">Año</label>
                    <input type="number" id="input-anio">
                </div>

                <div class="campo-formulario">
                    <label for="input-precio">Precio</label>
                    <input type="number" id="input-precio">
                </div>

                <div class="campo-formulario">
                    <label for="input-stock">Stock</label>
                    <input type="number" id="input-stock">
                </div>

                <button type="submit" class="card-boton">
                    Agregar guitarra
                </button>

            </form>
        </section>

        <section>
            <p id="mensaje"></p>
        </section>
    </main>

    <footer>
        <div class="footer-contenido">
            <img src="../assets/img/branding/chelos-guitars-logo.webp" alt="Chelo's Guitars" class="footer-logo">

            <p>Pasión por la música. Guitarras para todos los estilos.</p>
        </div>
    </footer>

</body>

</html>
