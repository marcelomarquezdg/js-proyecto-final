<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chelo's Guitars</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/main.js" defer></script>
</head>

<body class="home">

    <header>
        <div class="header-contenido">

            <a href="./index.html" class="logo-link">
                <img src="./assets/img/branding/chelos-guitars-logo.webp" alt="Chelo's Guitars" class="logo">
            </a>

            <nav>
                <a href="./index.html" class="nav-activo">Inicio</a>
                <a href="./pages/carrito.html">Carrito</a>
                <a href="./pages/gestion.html">Gestión</a>
            </nav>

        </div>
    </header>

    <main>
        <section class="hero">

            <p class="hero-etiqueta">Bienvenido a</p>

            <img src="./assets/img/branding/chelos-guitars-logo.webp" alt="Chelo's Guitars" class="hero-logo">

            <p class="hero-subtitulo">Tu tienda de guitarras</p>

            <section class="seccion-busqueda hero-busqueda">
                <div class="buscador-contenido">
                    <input type="text" id="busqueda" placeholder="Buscar por marca o modelo">
                </div>

                <p class="busqueda-ejemplo">Ej: Fender o Telecaster</p>
            </section>

        </section>

        <section>
            <h2 class="titulo-seccion">Guitarras disponibles</h2>
            <p id="mensaje"></p>
            <div id="contenedor-guitarras" class="productos"></div>
        </section>

        <section id="popup-promocion" class="popup-promocion">
            <div class="popup-contenido">
                <h2>Promo especial</h2>
                <p>Usá el código <strong>GUITARRA10</strong> y obtené 10% de descuento en tu compra.</p>
                <button id="cerrar-popup">Cerrar</button>
            </div>
        </section>


    </main>


    <footer>
        <div class="footer-contenido">
            <img src="./assets/img/branding/chelos-guitars-logo.webp" alt="Chelo's Guitars" class="footer-logo">
            <p>Pasión por la música. Guitarras para todos los estilos.</p>
        </div>
    </footer>

</body>

</html>
